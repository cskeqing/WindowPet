name: CI

on:
    pull_request:
    push:
        branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    web:
        name: Typecheck, build & test (web)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Node.js setup
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies (from lockfile)
              run: npm ci

            # `build` runs `tsc && vite build`, so this also covers typechecking.
            - name: Typecheck & build web
              run: npm run build

            - name: Run unit tests
              run: npx vitest run
